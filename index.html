<title>Mathe Training</title>
<style>
:root{
  --bg:#f1f4f9; --surface:#ffffff; --ink:#18202f; --muted:#5a6578; --line:#d7dee9;

@media (prefers-color-scheme: dark){

}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#172030; --ink:#e7ecf6; --muted:#9aa6bb; --line:#2a354a;
  --accent:#7aa2ff; --accent-ink:#0a1020; --accent-soft:#1c2a4a;
  --ok:#56cf93; --ok-bg:#12301f; --bad:#ff8f80; --bad-bg:#3a1b18; --hint-bg:#332c12; --hint-ink:#f3dd8a;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-ui);margin:0;padding-inline:16px;padding-block:14px 40px;-webkit-text-size-adjust:100%}

.btn:focus-visible,.opt:focus-visible,.key:focus-visible,input:focus-visible,.row:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}

.row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;min-height:56px}

/* ===== Politur ===== */

<script>
(function(){
/* ================= ENGINE: RNG, Formatierung, Parser, Prüfung ================= */
const MINUS = '−';
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeR(seed) {
  const f = mulberry32(seed);
  return {
    f,
    ri: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
    shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  };
}

/* ---------- Anzeige ---------- */
function fmtNum(n) {
  const r = Math.round(n * 1e9) / 1e9;
  let s = String(r);
  if (/e/i.test(s)) s = r.toFixed(9).replace(/0+$/, '').replace(/\.$/, '');
  return s.replace('-', MINUS);
}
const fmtPlain = (n) => fmtNum(n).replace(MINUS, '-');
const sup = (e) => '<sup>' + String(e).replace('-', MINUS) + '</sup>';
const pw = (b, e) => (e === 1 ? b : b + sup(e));
const frac = (n, d) => '<span class="fr"><span class="n">' + n + '</span><span class="d">' + d + '</span></span>';
const money = (x) => (Math.round(x * 100) / 100).toFixed(2);
const Q = (intro, math) => '<p class="intro">' + intro + '</p><div class="math">' + math + '</div>';

function eArr(vars, e) { return vars.map((v) => e[v] || 0); }
function monoVars(vars, ea, html) {
  let s = '';
  vars.forEach((v, i) => { if (ea[i] > 0) s += ea[i] === 1 ? v : (html ? v + sup(ea[i]) : v + '^' + ea[i]); });

  const re = /([\(\[])\s*([^,;\[\]\(\)]+?)\s*[,;]\s*([^,;\[\]\(\)]+?)\s*([\)\]])/g;

    const lo = bound(m[2]), hi = bound(m[3]);
    if (isNaN(lo) || isNaN(hi)) return null;
    pieces.push({ lo, hi, loC: m[1] === '[' && isFinite(lo), hiC: m[4] === ']' && isFinite(hi) });
    rest = rest.replace(m[0], '');
  }
  if (!pieces.length) return null;
  if (rest.replace(/∪|\bu\b|\bvereinigt\b|\s|;|\|/g, '').length) return null;
  return (t) => pieces.some((p) => (p.loC ? t >= p.lo - EPS : t > p.lo + EPS) && (p.hiC ? t <= p.hi + EPS : t < p.hi - EPS));
}

/* ====================== Intervalle aus Prädikat ====================== */
function intervalsOf(pred, keys) {
  const ks = uniqSorted(keys);
  const items = [{ type: 'open', lo: -Infinity, hi: ks[0], rep: ks[0] - 1 }];
  ks.forEach((k, i) => { items.push({ type: 'pt', v: k }); if (i < ks.length - 1) items.push({ type: 'open', lo: k, hi: ks[i + 1], rep: (k + ks[i + 1]) / 2 }); });
  items.push({ type: 'open', lo: ks[ks.length - 1], hi: Infinity, rep: ks[ks.length - 1] + 1 });
  const runs = []; let cur = null;
  for (const it of items) {
    const tr = it.type === 'pt' ? pred(it.v) : pred(it.rep);
    if (tr) {
      if (!cur) cur = { lo: it.type === 'pt' ? it.v : it.lo, loC: it.type === 'pt', hi: 0, hiC: false };
      cur.hi = it.type === 'pt' ? it.v : it.hi; cur.hiC = it.type === 'pt';
    } else if (cur) { runs.push(cur); cur = null; }
  }
  if (cur) runs.push(cur);
  return runs;
}
const bS = (v) => (v === Infinity ? '∞' : v === -Infinity ? M + '∞' : numS(v));
function runsInterval(runs) { if (!runs.length) return 'keine Lösung'; return runs.map((r) => (r.loC ? '[' : '(') + bS(r.lo) + ', ' + bS(r.hi) + (r.hiC ? ']' : ')')).join(' ∪ '); }

  if (!runs.length) return 'keine Lösung';
  return runs.map((r) => {
    if (r.lo === -Infinity && r.hi === Infinity) return 'alle ' + v;
    if (r.lo === r.hi) return v + ' = ' + bS(r.lo);
    if (r.lo === -Infinity) return v + (r.hiC ? ' ≤ ' : ' < ') + bS(r.hi);
    if (r.hi === Infinity) return v + (r.loC ? ' ≥ ' : ' > ') + bS(r.lo);
    return bS(r.lo) + (r.loC ? ' ≤ ' : ' < ') + v + (r.hiC ? ' ≤ ' : ' < ') + bS(r.hi);
  }).join(' oder ');
}

/* ====================== Zahlengerade (SVG) ====================== */
function numberLine(lo, hi, loC, hiC) {
  const W = 520, H = 74, pad = 28, a = -10, b = 10;
  const X = (v) => pad + (v - a) / (b - a) * (W - 2 * pad);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="nl" role="img" aria-label="Zahlengerade">`;
  s += `<line x1="${pad - 14}" y1="36" x2="${W - pad + 14}" y2="36" stroke="currentColor" stroke-width="1.5"/>`;
  s += `<path d="M${pad - 14} 36 l8 -4 v8 z M${W - pad + 14} 36 l-8 -4 v8 z" fill="currentColor"/>`;
  for (let v = a; v <= b; v++) { const h = v % 2 === 0 ? 7 : 4; s += `<line x1="${X(v)}" y1="${36 - h}" x2="${X(v)}" y2="${36 + h}" stroke="currentColor"/>`; if (v % 2 === 0) s += `<text x="${X(v)}" y="64" font-size="13" text-anchor="middle" fill="currentColor">${String(v).replace('-', M)}</text>`; }
  const x1 = lo === -Infinity ? pad - 14 : X(lo), x2 = hi === Infinity ? W - pad + 14 : X(hi);
  s += `<line x1="${x1}" y1="36" x2="${x2}" y2="36" stroke="#2f5fd0" stroke-width="6" stroke-linecap="round"/>`;
  if (lo !== -Infinity) s += `<circle cx="${X(lo)}" cy="36" r="6" fill="${loC ? '#2f5fd0' : '#fff'}" stroke="#2f5fd0" stroke-width="3"/>`;
  if (hi !== Infinity) s += `<circle cx="${X(hi)}" cy="36" r="6" fill="${hiC ? '#2f5fd0' : '#fff'}" stroke="#2f5fd0" stroke-width="3"/>`;
  return s + '</svg>';
}

function gProzent(r) {

function gFormel(r) {

  const k = r.int(2, 5); return { type: 'expr', text: `Löse nach a auf:  U = ${k}(a + b)`, ref: `U/${k}-b`, vars: ['U', 'b'], ans: `a = U/${k} − b`, sol: `U/${k} = a + b → a = U/${k} − b` };

function setQ(text, vals, sol, extra = {}) { vals = uniqSorted(vals); return { type: 'set', noneBtns: vals.length === 0 || extra.noneBtns, vals, text, ans: vals.length ? 'x = ' + vals.map(numS).join(', ') : 'Keine Lösung', sol, ...extra }; }
function gQuad(r) {
  const a = r.nz(-8, 8), c = r.int(1, 13); const x = 'x';

function gProd(r) {

  if (v === 1) { const A = r.int(2, 6), m = r.int(2, 9); const vr = r.pick(['a', 'x', 'y']); return setQ(`Löse:  ${A}${vr}² = ${A * m}${vr}`, [0, m], `${A}${vr}(${vr} − ${m}) = 0 → ${vr} = 0 oder ${vr} = ${m}  (nicht durch ${vr} teilen!)`); }

}

function gBruchGl(r) {

const DAT = { 2: 'Zweifachen', 3: 'Dreifachen', 4: 'Vierfachen', 5: 'Fünffachen' };
const NOM = { 2: 'Doppelte', 3: 'Dreifache', 4: 'Vierfache', 5: 'Fünffache' };
function gRaetsel(r) {
  const v = r.int(0, 2), s = r.int(-9, 9);
  if (v === 0) { let k, m, pp; do { k = r.int(2, 5); m = r.int(2, 6); pp = r.int(2, 9); } while (m * k === pp); const a = r.int(2, 9), q = m * (k * s + a) - pp * s; return { type: 'num', text: `Wenn ${a} addiert wird zum ${DAT[k]} einer Zahl und diese Summe mit ${m} multipliziert wird, ergibt sich dasselbe Resultat wie bei der Multiplikation dieser Zahl mit ${pp} und anschliessender ${q < 0 ? 'Subtraktion' : 'Addition'} von ${Math.abs(q)}. Welche Zahl ist das?`, val: s, ans: String(s), sol: `${m}(${k}x + ${a}) = ${pp}x ${q < 0 ? '−' : '+'} ${Math.abs(q)} → ${m * k}x + ${m * a} = ${pp}x ${q < 0 ? '−' : '+'} ${Math.abs(q)} → x = ${s}` }; }
  if (v === 1) { let k, l; do { k = r.int(2, 5); l = r.int(2, 5); } while (k === l); const a = r.int(2, 9), b = k * s - a - l * s; return { type: 'num', text: `Das ${NOM[k]} einer Zahl, vermindert um ${a}, ist gleich dem ${DAT[l]} der Zahl, ${b < 0 ? 'vermindert' : 'vermehrt'} um ${Math.abs(b)}. Welche Zahl ist das?`, val: s, ans: String(s), sol: `${k}x − ${a} = ${l}x ${b < 0 ? '−' : '+'} ${Math.abs(b)} → x = ${s}` }; }
  let m, k; do { m = r.int(2, 6); k = r.int(2, 6); } while (m === k); const a = r.int(2, 9), q = m * (s + a) - k * s; return { type: 'num', text: `Wenn man ${a} zu einer Zahl addiert und die Summe mit ${m} multipliziert, erhält man das ${k}-Fache der Zahl ${q < 0 ? 'vermindert' : 'vermehrt'} um ${Math.abs(q)}. Welche Zahl ist das?`, val: s, ans: String(s), sol: `${m}(x + ${a}) = ${k}x ${q < 0 ? '−' : '+'} ${Math.abs(q)} → ${m}x + ${m * a} = ${k}x ${q < 0 ? '−' : '+'} ${Math.abs(q)} → x = ${s}` };

function gKosten(r) {
  const v = r.int(0, 2);
  if (v === 0) {
    const prod = r.pick([['Eine Bäckerei', 'Brote', 'Stück'], ['Eine Schreinerei', 'Stühle', 'Stück'], ['Eine Kornmühle', 'Viehfutterzusatz', 'Tonnen'], ['Eine Druckerei', 'Bücher', 'Stück']]);
    const vv = r.int(2, 90), p = vv + r.int(5, 60), F = r.pick([500, 2000, 3000, 12000, 50000, 130000, 120000]), G = r.pick([1000, 6000, 8000, 50000, 550000, 500000, 20000]);
    const val = Math.ceil((G + F) / (p - vv) - 1e-9);
    return { type: 'num', text: `${prod[0]} produziert ${prod[1]} mit variablen Kosten von ${vv} € pro ${prod[2] === 'Tonnen' ? 'Tonne' : 'Stück'}. Die Fixkosten sind ${th(F)} € pro Monat, der Verkaufspreis ist ${p} €. Wie viele ${prod[2]} müssen pro Monat verkauft werden, um einen Gewinn von ${th(G)} € zu erzielen? (Auf die nächste ganze Zahl runden.)`, val, ans: String(val), sol: `(${p} − ${vv})·q − ${th(F)} = ${th(G)} → ${p - vv}q = ${th(G + F)} → q = ${((G + F) / (p - vv)).toFixed(2).replace('.', ',')} → aufrunden: ${val}` };
  }
  if (v === 1) {
    const base = r.pick([20, 30, 35, 40, 45, 50]); const rc = r.pick([10, 15, 20, 25, 30, 35, 40]); const bud = base + r.int(10, 45);
    const val = Math.floor(((bud - base) * 100) / rc + 1e-9);
    return { type: 'num', text: `Jemand darf höchstens ${bud} € pro Tag für ein Mietauto ausgeben. Die Miete kostet ${base} € pro Tag zuzüglich ${dec((rc / 100).toFixed(2))} € pro Kilometer. Wie viele Kilometer darf er höchstens fahren? (Abrunden.)`, val, ans: String(val), sol: `${base} + ${dec((rc / 100).toFixed(2))}·k ≤ ${bud} → k ≤ ${((bud - base) * 100 / rc).toFixed(2).replace('.', ',')} → abrunden: ${val}` };
  }
  let m, r1, r2, K; do { m = r.pick([250, 300, 360, 420, 500]); r1 = r.pick([3, 4, 5, 6]); r2 = r1 + r.pick([2, 3, 4, 5]); K = r.pick([3000, 3600, 4200, 4900, 2500]); } while (12 * m <= K);
  const val = Math.ceil(((12 * m - K) * 100) / (r2 - r1) - 1e-9);
  return { type: 'num', text: `Mieten: ${m} € pro Monat (auf Jahresbasis) und ${dec((r1 / 100).toFixed(2))} € pro km. Kaufen: ${th(K)} € feste Jahresausgabe und ${dec((r2 / 100).toFixed(2))} € pro km. Wie viele Kilometer muss man mindestens pro Jahr fahren, damit Mieten nicht teurer ist als Kaufen? (Aufrunden.)`, val, ans: String(val), sol: `${12 * m} + ${dec((r1 / 100).toFixed(2))}k ≤ ${K} + ${dec((r2 / 100).toFixed(2))}k → ${12 * m - K} ≤ ${dec(((r2 - r1) / 100).toFixed(2))}k → k ≥ ${((12 * m - K) * 100 / (r2 - r1)).toFixed(2).replace('.', ',')} → aufrunden: ${val}` };
}
T('kosten', 'Textaufgaben: Kosten & Gewinn', 'Gleichungen', [gKosten]);

/* --- Ungleichungen --- */
function ineqQ(text, pred, keys, sol, v = 'x', extra = {}) { const runs = intervalsOf(pred, keys); return { type: 'ineq', v, pred, keys, text, ans: runsIneq(runs, v), sol, ...extra }; }
function gUngl(r) {

  if (k === 2) { const c = r.int(2, 6), bound = r.nz(-8, 8), op = r.pick(ops); const a = -c, m = a * bound; const correct = flip[op]; const opts = ops.slice(); return { type: 'choice', text: `Ersetze das Leerzeichen durch das richtige Zeichen: Wenn ${lin(a, 0)} ${op} ${m}, dann ist x ___ ${sg(bound)}${Math.abs(bound)}. (Durch eine negative Zahl teilen!)`, options: opts, correct: opts.indexOf(correct), ans: correct, sol: `Division durch ${a} (negativ) → Zeichen dreht sich um: ${correct}` }; }
  if (k === 3) { const p = r.int(2, 5), q = r.nz(-6, 6), t = r.nz(-9, 9); let rr; do { rr = r.int(1, 7); } while (rr === p); const op = r.pick(ops); const pred = (x) => cmp(p * (x + q), rr * x + t, op); const key = (t - p * q) / (p - rr); return ineqQ(`Löse die Ungleichung (Eingabe z. B. x > 3):  ${p}(${lin(1, q)}) ${op} ${lin(rr, t)}`, pred, [key], `Klammer auflösen, x-Terme sammeln, bei Division durch eine negative Zahl Zeichen drehen`); }
  let a; do { a = r.int(-7, 7); } while (a === 0); const b = r.int(-9, 9), c = r.int(-12, 12), op = r.pick(ops);
  const pred = (x) => cmp(a * x + b, c, op); return ineqQ(`Löse die Ungleichung (Eingabe z. B. x > 3):  ${lin(a, b)} ${op} ${c}`, pred, [(c - b) / a], `${lin(a, 0)} ${op} ${c - b}  →  durch ${a}${a < 0 ? ': Zeichen dreht sich um' : ''}`);
}

function gTextUngl(r) {
  const v = r.int(0, 2);

    const ph = r.pick([['mindestens', '≥'], ['höchstens', '≤'], ['mehr als', '>'], ['weniger als', '<'], ['nicht weniger als', '≥'], ['nicht mehr als', '≤'], ['über', '>'], ['unter', '<']]);
    const n = r.pick([15000, 200, 40, 25, 300, 5, 1200, 80]); const ctx = r.pick([[`Mein Gehalt im nächsten Jahr wird ${ph[0]} ${n} € sein.`], [`Die Anzahl der Gäste ist ${ph[0]} ${n}.`], [`Das Gewicht beträgt ${ph[0]} ${n} kg.`], [`Der Kontostand liegt ${ph[0]} ${n} €.`]])[0];

  }

}
T('text', 'Text → Ungleichung, Tarife', 'Ungleichungen', [gTextUngl]);

function gVZProd(r) {
  const v = r.int(0, 3), op = r.pick(['>', '<']);

  if (v === 2) { let a, b, c; do { a = r.int(-8, 8); b = r.int(-8, 8); c = r.int(-8, 8); } while (new Set([a, b, c]).size < 3); return ineqQ(`Vorzeichendiagramm: Für welche x gilt  (${lin(1, -a)})(${lin(1, -b)})(${lin(1, -c)}) ${op} 0 ?`, (x) => sgn((x - a) * (x - b) * (x - c)), [a, b, c], `Nullstellen ${a}, ${b}, ${c}`); }

function gVZBruch(r) {
  const v = r.int(0, 3), op = r.pick(['>', '<']);
  const sgn = (val) => (op === '>' ? val > EPS : val < -EPS);
  if (v === 0) { let a, b; do { a = r.nz(-8, 8); b = r.nz(-8, 8); } while (a === -b); return ineqQ(`Für welche x gilt  ${fh(lin(1, -a), lin(1, b))} ${op} 0 ?`, (x) => { const d = x + b; return Math.abs(d) > EPS && sgn((x - a) / d); }, [a, -b], `Nullstelle Zähler: ${a}; Nullstelle Nenner: ${-b} (nie dabei)`); }
  if (v === 1) { const m = r.int(1, 5), c = r.int(2, 9); return ineqQ(`Für welche x gilt  ${fh(`x + 2(${m} − x)`, `x(${c} − x)`)} ${op} 0 ?`, (x) => { const d = x * (c - x); return Math.abs(d) > EPS && sgn((2 * m - x) / d); }, [2 * m, 0, c], `Zähler = 2·${m} − x → Nullstelle ${2 * m}; Nenner: 0 und ${c}`); }
  if (v === 2) { let a, b; do { a = r.nz(-8, 8); b = r.int(1, 8); } while (a === 0 || a === -b); return ineqQ(`Für welche x gilt  ${fh(lin(1, -a), `x(${lin(1, b)})`)} ${op} 0 ?`, (x) => { const d = x * (x + b); return Math.abs(d) > EPS && sgn((x - a) / d); }, [a, 0, -b], `Nullstellen: Zähler ${a}; Nenner 0 und ${-b}`); }

T('vzbruch', 'Vorzeichendiagramm: Bruch', 'Ungleichungen', [gVZBruch]);

function gBetragUngl(r) {
  const p = r.nz(-5, 5), q = r.int(-9, 9), op = r.pick(['<', '>', '≤', '≥']); const neg = r.chance(0.1); const c = neg ? -r.int(1, 5) : r.int(1, 12);
  const pred = (x) => cmp(Math.abs(p * x + q), c, op); const keys = neg ? [0] : [(c - q) / p, (-c - q) / p];
  const runs = intervalsOf(pred, keys); const asInterval = r.chance(0.6);
  const t = `|${lin(p, q)}| ${op} ${sg(c)}${Math.abs(c)}`;
  return { type: asInterval ? 'interval' : 'ineq', v: 'x', pred, keys, noneBtns: true, text: `Löse die Ungleichung ${t}.` + (asInterval ? ' Gib die Lösung in Intervallnotation an, z. B. (−∞, −2] ∪ [3, 7).' : ' Eingabe z. B. x < −2 oder x > 3.'), ans: asInterval ? runsInterval(runs) : runsIneq(runs), sol: neg ? 'Ein Betrag ist nie negativ: ' + (op === '<' || op === '≤' ? 'keine Lösung' : 'immer erfüllt') : `${op === '<' || op === '≤' ? 'Zwischen-Bereich: −c ' + op + ' ' + lin(p, q) + ' ' + op + ' c' : 'Zwei Seiten: ' + lin(p, q) + ' ' + op + ' c  oder  ' + lin(p, q) + ' ' + flip[op] + ' −c'}; Grenzen ${bS((c - q) / p)} und ${bS((-c - q) / p)}` };
}

function adaptLegacy(q, topicId) {

  const p = { topic: topicId, html: '<p class="intro">' + q.text + '</p>' + fig, ansHtml: escL(q.ans), steps: [q.sol ? escL(q.sol) : 'Antwort: ' + escL(q.ans)], vars: [], legacy: q, hint: th ? 'Erster Schritt: ' + th.schritte[0] : 'Schau unter „Theorie“ nach dem Vorgehen.' };

  p.kind = 'l' + (q.type === 'interval' ? 'interval' : q.type); if (q.type === 'ineq') p.kind = 'lineq';
  p.ref = LEG.testAnswer(q);

  const extra = [];
  if (q.noneBtns) extra.push({ label: q.noneLabel || 'Keine Lösung', value: q.noneLabel ? 'existiert nicht' : 'keine Lösung' });
  if (q.topic === 'lin') extra.push({ label: 'Unendlich viele', value: 'unendlich viele' });
  p.extra = extra;
  return p;
}

itte": [" Variable bestimmen, die allein stehen soll.", " Bruch vor der Klammer wegbringen: mit dem Kehrbruch multiplizieren.", " Danach die Zahl in der Klammer auf die andere Seite bringen.", " Ergebnis in der Form „n = Zahl · F + Zahl“ schreiben.", " Probe mit einer Testzahl, z. B. n = 5 einsetzen und wieder zurückrechnen."], "beispiele": [{"t": " P = (3/4)(m + 2)   nach m auflösen", "l": ["(4/3)·P = m + 2      | · 4/3", "m = (4/3)P − 2      | −2"], "a": "m = (4/3)·P − 2"}, {"t": " K = 80 + 0,5·s   nach s auflösen", "l": ["K − 80 = 0,5·s      | −80", "s = 2(K − 80)      | ÷ 0,5 = mal 2", "s = 2K − 160"], "a": "s = 2K − 160"}, {"t": " U = (2/3)(a − 5)   nach a auflösen", "l": ["(3/2)·U = a − 5      | · 3/2", "a = (3/2)U + 5      | +5"], "a": "a = (3/2)·U + 5"}], "uebungen": [" F = (9/5)C + 32   nach C", " y = (2/7)(t + 4)   nach t", " V = (4/3)(h − 6)   nach h", " S = 3(n + 2)   nach n", " G = (5/2)(k − 1)   nach k"], "loesungen": [" C = (5/9)F − 160/9     (F − 32 = (9/5)C → C = (5/9)(F − 32))", " t = (7/2)·y − 4     ((7/2)y = t + 4)", " h = (3/4)·V + 6     ((3/4)V = h − 6)", " n = (1/3)·S − 2     (S/3 = n + 2)", " k = (2/5)·G + 1     ((2/5)G = k − 1)"]}, {"n": 10, "titel": "Quadratische Gleichungen: Wurzel ziehen", "typ": "(x + a)² = Zahl – Lösungsmenge angeben", "formel": ["(x + a)² = c   mit c > 0   ⇒   x + a = √c   oder   x + a = −√c", "c = 0 ⇒ genau eine Lösung: x = −a", "c < 0 ⇒ keine Lösung (ein Quadrat ist nie negativ): L = { }"], "schritte": [" Steht links schon ein Quadrat (x + a)² und rechts eine Zahl c? Dann Wurzel ziehen.", " Zwei Fälle aufschreiben: + und −.", " Jede Gleichung einzeln nach x auflösen.", " Lösungsmenge in geschweiften Klammern angeben, z. B. L = {7, −3}."], "beispiele": [{"t": " (x − 2)² = 25", "l": ["x − 2 = 5   oder   x − 2 = −5", "x = 7   oder   x = −3"], "a": "L = {−3, 7}"}, {"t": " (x + 1)² = 49", "l": ["x + 1 = 7   oder   x + 1 = −7", "x = 6   oder   x = −8"], "a": "L = {−8, 6}"}, {"t": " (x + 4)² = 0", "l": ["x + 4 = 0", "x = −4"], "a": "L = {−4}"}, {"t": " (x + 3)² = −4", "l": ["Ein Quadrat ist nie negativ."], "a": "L = { }"}], "uebungen": [" (x + 5)² = 81", " (x − 6)² = 16", " (x + 2)² = 144", " (x − 1)² = 0", " (x + 7)² = −9"], "loesungen": [" L = {−14, 4}     (x + 5 = ±9)", " L = {2, 10}     (x − 6 = ±4)", " L = {−14, 10}     (x + 2 = ±12)", " L = {1}     (x − 1 = 0)", " L = { }     (negativ)"]}, {"n": 11, "titel": "Ausklammern und Produkt = Null", "typ": "4a² = 32a  und  (x − 9)(3x + 1) = 0", "formel": ["Produkt-Null-Eigenschaft:  A · B = 0  ⇒  A = 0  oder  B = 0", "Ausklammern:  ax² + bx = x(ax + b)", "Nie durch die Variable teilen, sonst geht die Lösung 0 verloren!"], "schritte": [" Alles auf eine Seite bringen, sodass rechts 0 steht.", " Gemeinsamen Faktor ausklammern (zuerst Zahl, dann Variable).", " Jeden Faktor gleich 0 setzen.", " Jede einfache Gleichung lösen.", " Lösungen mit Komma trennen."], "beispiele": [{"t": " 5a² = 35a", "l": ["5a² − 35a = 0      | alles nach links", "5a(a − 7) = 0      | ausklammern", "5a = 0 → a = 0    oder    a − 7 = 0 → a = 7"], "a": "a = 0, 7"}, {"t": " (x − 4)(2x + 6) = 0", "l": ["x − 4 = 0 → x = 4", "2x + 6 = 0 → 2x = −6 → x = −3"], "a": "{4, −3}"}, {"t": " (3x + 2)(x − 5) = 0", "l": ["3x + 2 = 0 → x = −2/3", "x − 5 = 0 → x = 5"], "a": "{−2/3, 5}"}, {"t": " x² − 9x = 0", "l": ["x(x − 9) = 0", "x = 0    oder    x = 9"], "a": "{0, 9}"}], "uebungen": [" 3a² = 27a", " (x + 6)(4x − 8) = 0", " (2x − 1)(5x + 10) = 0", " x² + 5x = 0", " 6y² = 24y"], "loesungen": [" a = 0, 9     (3a(a − 9) = 0)", " {−6, 2}     (x = −6 oder 4x = 8)", " {1/2, −2}     (2x = 1 oder 5x = −10)", " {0, −5}     (x(x + 5) = 0)", " y = 0, 4     (6y(y − 4) = 0)"]}, {"n": 12, "titel": "Bruchgleichungen (Bruch = 0)", "typ": "(x² − 1)/(x(x + 1)) = 0 – ganze Zahl angeben", "formel": ["A/B = 0  ⇒  A = 0  und  B ≠ 0", "Nenner = 0 ist verboten: diese x-Werte sind keine Lösung", "Dritte binomische Formel: x² − c² = (x − c)(x + c)"], "schritte": [" Nenner gleich 0 setzen: die „verbotenen“ Werte notieren.", " Zähler gleich 0 setzen und lösen (ggf. faktorisieren).", " Lösungen streichen, die ein verbotener Wert sind.", " Bleibt nichts übrig: keine Lösung."], "beispiele": [{"t": " (x² − 16)/(x(x + 4)) = 0", "l": ["Verboten: x = 0 und x = −4", "Zähler: x² − 16 = 0 → x = 4 oder x = −4", "x = −4 ist verboten → gestrichen"], "a": "x = 4"}, {"t": " (x − 3)/(x + 2) = 0", "l": ["Verboten: x = −2", "Zähler: x − 3 = 0 → x = 3"], "a": "x = 3"}, {"t": " (x² − 4)/(x − 2) = 0", "l": ["Verboten: x = 2", "Zähler: x = 2 oder x = −2", "x = 2 ist verboten"], "a": "x = −2"}], "uebungen": [" (x² − 25)/(x(x + 5)) = 0", " (x + 6)/(x − 1) = 0", " (x² − 9)/(x + 3) = 0", " (x² − 1)/(x − 1) = 0", " (x − 8)/(x(x − 8)) = 0"], "loesungen": [" x = 5     (−5 und 0 verboten)", " x = −6     (1 verboten)", " x = 3     (−3 verboten)", " x = −1     (1 verboten)", " Keine Lösung.     (Zähler 8 ist verboten)"]}, {"n": 13, "titel": "Zahlenrätsel (Text in Gleichung übersetzen)", "typ": "„Wenn 9 addiert wird zum Zweifachen einer Zahl …“", "formel": ["„eine Zahl“ = x        „das Doppelte“ = 2x        „das Dreifache“ = 3x", "„… addiert, dann multipliziert“ → Klammer:  5 · (2x + 9)", "„dasselbe wie“ / „ergibt“ / „ist gleich“ → Gleichheitszeichen"], "schritte": [" Die gesuchte Zahl x nennen.", " Den Satz in Teilstücke zerlegen und jedes Stück als Term schreiben.", " Stehen „addieren/subtrahieren“ vor „multiplizieren“? Dann Klammer setzen.", " Beide Seiten mit = verbinden und die Gleichung lösen.", " Probe am Text: stimmt der Satz mit deiner Zahl?"], "beispiele": [{"t": " Wenn 4 zum Dreifachen einer Zahl addiert wird und diese Summe mit 2 multipliziert wird, ergibt sich dasselbe wie bei der Multiplikation der Zahl mit 5 und anschliessender Addition von 10.", "l": ["Linke Seite: 2(3x + 4)", "Rechte Seite: 5x + 10", "2(3x + 4) = 5x + 10", "6x + 8 = 5x + 10 → x = 2", "Probe: 2·(6 + 4) = 20 und 5·2 + 10 = 20 ✓"], "a": "Die Zahl ist 2."}, {"t": " Das Doppelte einer Zahl, vermindert um 7, ergibt das Dreifache der Zahl, vermehrt um 2.", "l": ["2x − 7 = 3x + 2", "−7 − 2 = 3x − 2x", "x = −9"], "a": "Die Zahl ist −9."}, {"t": " Wenn man 5 zu einer Zahl addiert und die Summe mit 3 multipliziert, erhält man das Vierfache der Zahl, vermehrt um 20.", "l": ["3(x + 5) = 4x + 20", "3x + 15 = 4x + 20", "−5 = x"], "a": "Die Zahl ist −5."}], "uebungen": [" Wenn 1 zum Zweifachen einer Zahl addiert und die Summe mit 3 multipliziert wird, ergibt sich dasselbe wie bei Multiplikation der Zahl mit 4 und Addition von 11.", " Wenn man 6 zu einer Zahl addiert und die Summe verdoppelt, erhält man das Dreifache der Zahl, vermehrt um 5.", " Das Dreifache einer Zahl, vermindert um 8, ist gleich dem Doppelten der Zahl, vermehrt um 1.", " Wenn man 2 von einer Zahl subtrahiert und die Differenz mit 4 multipliziert, erhält man das Fünffache der Zahl, vermehrt um 6.", " Wenn man 1 zu einer Zahl addiert und mit 6 multipliziert, erhält man dasselbe, wie wenn man 4 zur Zahl addiert und mit 5 multipliziert."], "loesungen": [" 4     (3(2x + 1) = 4x + 11)", " 7     (2(x + 6) = 3x + 5)", " 9     (3x − 8 = 2x + 1)", " −14     (4(x − 2) = 5x + 6)", " 14     (6(x + 1) = 5(x + 4))"]}, {"n": 14, "titel": "Textaufgaben: Kosten, Gewinn, Mieten oder Kaufen", "typ": "Kornmühle (Gewinn), Autovermietung (Budget), Mieten vs. Kaufen", "formel": ["Kosten = Fixkosten + variable Kosten pro Stück · Menge", "Erlös = Verkaufspreis · Menge          Gewinn = Erlös − Kosten", "Gewinnziel:  (Preis − variable Kosten) · q − Fixkosten = Gewinn", "Budget-Aufgaben: Grundpreis + Preis pro km · k ≤ Budget"], "schritte": [" Variable wählen (q = Menge, k = Kilometer).", " Jede Kostenart als Term schreiben: fest + variabel·Menge.", " Bedingung aufstellen (Gewinn = …, Kosten ≤ …, Kosten A ≤ Kosten B).", " Gleichung bzw. Ungleichung lösen.", " Sinnvoll runden: „mindestens“ → aufrunden, „höchstens“ → abrunden.", " Jahr und Monat nicht vermischen (12 · Monatspreis = Jahrespreis)."], "beispiele": [{"t": " Eine Bäckerei produziert Brote mit variablen Kosten von 2 € pro Stück. Die Fixkosten sind 3000 € pro Monat, der Verkaufspreis ist 5 € pro Stück. Wie viele Brote müssen pro Monat verkauft werden, um 6000 € Gewinn zu erzielen?", "l": ["(5 − 2)·q − 3000 = 6000", "3q = 9000", "q = 3000"], "a": "3000 Brote"}, {"t": " Variable Kosten 4 € pro Stück, Fixkosten 450 €, Verkaufspreis 11 €. Wie viele Stück für 1000 € Gewinn? (Auf ganze Zahl runden.)", "l": ["(11 − 4)·q − 450 = 1000", "7q = 1450", "q = 207,14…  → es braucht mindestens 208 Stück (aufrunden)"], "a": "208 Stück"}, {"t": " Ein Fahrradverleih kostet 12 € pro Tag plus 0,30 € pro Kilometer. Das Budget beträgt höchstens 30 € pro Tag. Wie viele Kilometer sind maximal möglich?", "l": ["12 + 0,30·k ≤ 30", "0,30·k ≤ 18", "k ≤ 60"], "a": "höchstens 60 km"}, {"t": " Mieten: 300 € pro Monat (Jahresbasis) und 0,05 € pro km. Kaufen: 3000 € feste Jahresausgabe und 0,11 € pro km. Ab wie vielen Kilometern pro Jahr ist Mieten nicht teurer als Kaufen?", "l": ["Mieten: 12·300 + 0,05k = 3600 + 0,05k", "Kaufen: 3000 + 0,11k", "3600 + 0,05k ≤ 3000 + 0,11k", "600 ≤ 0,06k", "k ≥ 10 000"], "a": "mindestens 10 000 km"}], "uebungen": [" Fixkosten 2000 €, variable Kosten 15 € pro Stück, Preis 40 €. Wie viele Stück für 8000 € Gewinn?", " Fixkosten 120 000 €, variable Kosten 60 € pro Tonne, Preis 95 € pro Tonne. Wie viele Tonnen für 500 000 € Gewinn? (Auf ganze Zahl runden.)", " Ein Taxi kostet 4 € Grundpreis plus 1,50 € pro Kilometer. Budget: höchstens 25 €. Wie viele km?", " Autovermietung: 30 € pro Tag plus 0,25 € pro km. Budget: höchstens 80 € pro Tag. Wie viele km maximal?", " Mieten: 360 € pro Monat und 0,03 € pro km. Kaufen: 3000 € feste Jahresausgabe und 0,08 € pro km. Ab wie vielen km pro Jahr ist Mieten nicht teurer?"], "loesungen": [" 400 Stück     (25q = 10 000)", " 17 715 Tonnen     (35q = 620 000 → 17 714,3 → aufrunden)", " höchstens 14 km     (1,5k ≤ 21)", " höchstens 200 km     (0,25k ≤ 50)", " mindestens 26 400 km     (4320 + 0,03k ≤ 3000 + 0,08k → 1320 ≤ 0,05k)"]}, {"n": 15, "titel": "Lineare Ungleichungen und ihre Rechenregeln", "typ": "−2x < 12 → x ? −6;  Rechenregeln wahr/falsch", "formel": ["Addieren/Subtrahieren derselben Zahl:  Zeichen bleibt", "Mal/Durch eine POSITIVE Zahl:  Zeichen bleibt", "Mal/Durch eine NEGATIVE Zahl:  Zeichen dreht sich um  (< wird >, ≤ wird ≥)"], "schritte": [" Wie eine Gleichung umformen.", " Bei Multiplikation oder Division mit einer negativen Zahl das Ungleichheitszeichen umdrehen.", " Lösung als Bereich angeben (z. B. x > −6).", " Probe mit einer Zahl aus dem Bereich und einer ausserhalb."], "beispiele": [{"t": " 3x − 5 < 10", "l": ["3x < 15      | +5", "x < 5      | ÷3 (positiv: Zeichen bleibt)"], "a": "x < 5"}, {"t": " −4x ≥ 20", "l": ["x ≤ −5      | ÷(−4): Zeichen dreht sich um!"], "a": "x ≤ −5"}, {"t": " 2 − 3x > 11", "l": ["−3x > 9      | −2", "x < −3      | ÷(−3): Zeichen dreht sich um!"], "a": "x < −3"}, {"t": " Ersetzen Sie das Leerzeichen: Wenn −3x < 12, dann ist x ___ −4.", "l": ["Beide Seiten durch −3 teilen → Zeichen dreht sich um:", "x > −4"], "a": "x > −4"}], "uebungen": [" 2x + 7 ≤ 15", " −5x < 30", " 4 − 2x ≥ 10", " Wenn −6x > 18, dann ist x ___ −3.", " 3(x − 2) < 2x + 1"], "loesungen": [" x ≤ 4     (2x ≤ 8)", " x > −6     (÷(−5) dreht)", " x ≤ −3     (−2x ≥ 6 → ÷(−2) dreht)", " x < −3     (÷(−6) dreht)", " x < 7     (3x − 6 < 2x + 1)"]}, {"n": 16, "titel": "Ungleichungen aus Texten und Tarifvergleiche", "typ": "Aussage in Ungleichung übersetzen; Telefontarife A vs. B", "formel": ["mindestens / nicht weniger als  →  ≥          höchstens / nicht mehr als  →  ≤", "mehr als / über  →  >                          weniger als / unter  →  <", "Tarif = Grundgebühr + Preis pro Minute · m       „A billiger als B“:  Tarif A < Tarif B"], "schritte": [" Signalwort im Text finden und in das passende Zeichen übersetzen.", " Bei Tarifen: Kosten A und Kosten B als Terme schreiben.", " Bedingung „A billiger als B“ → Kosten A < Kosten B.", " Ungleichung lösen (Zeichen bei Division durch negative Zahl drehen).", " Antwort in Worten: „mehr als … Minuten“ bzw. „weniger als … Minuten“.", " Faustregel: Hohe Grundgebühr + tiefer Minutenpreis → billiger bei vielen Minuten."], "beispiele": [{"t": " „Mein Budget beträgt höchstens 200 €.“ (Variable x)", "l": ["höchstens → ≤"], "a": "x ≤ 200 €"}, {"t": " „Die Temperatur liegt über 25 Grad.“ (Variable x)", "l": ["über → >"], "a": "x > 25"}, {"t": " Tarif A: 8 € Grundgebühr + 0,10 € pro Minute. Tarif B: 5 € Grundgebühr + 0,16 € pro Minute. Wann ist A billiger?", "l": ["8 + 0,10m < 5 + 0,16m", "3 < 0,06m", "m > 50"], "a": "A ist billiger für mehr als 50 Minuten."}, {"t": " Tarif A: 10 € + 0,05 € pro Minute. Tarif B: 4 € + 0,15 € pro Minute. Wann ist A billiger?", "l": ["10 + 0,05m < 4 + 0,15m", "6 < 0,10m", "m > 60"], "a": "A ist billiger für mehr als 60 Minuten."}], "uebungen": [" „Die Anzahl der Gäste ist höchstens 40.“", " „Das Gewicht darf nicht unter 5 kg liegen.“", " „Mein Kontostand ist kleiner als 300 €.“", " A: 12 € + 0,08 € pro Minute. B: 6 € + 0,14 € pro Minute. Wann ist A billiger?", " A: 5 € + 0,20 € pro Minute. B: 11 € + 0,10 € pro Minute. Wann ist A billiger?"], "loesungen": [" x ≤ 40     (höchstens → ≤)", " x ≥ 5     (nicht unter → ≥)", " x < 300     (kleiner als → <)", " mehr als 100 Minuten     (6 < 0,06m)", " weniger als 60 Minuten     (0,10m < 6)"]}, {"n": 17, "titel": "Vorzeichendiagramm bei Produkten", "typ": "x(4 − x²) > 0", "formel": ["Produkt positiv ⇔ gerade Anzahl negativer Faktoren", "Produkt negativ ⇔ ungerade Anzahl negativer Faktoren", "Nullstellen teilen die Zahlengerade in Intervalle"], "schritte": [" Ausdruck in Faktoren zerlegen (ausklammern, 3. binomische Formel: 9 − x² = (3 − x)(3 + x)).", " Nullstellen jedes Faktors bestimmen.", " Zahlengerade zeichnen, Nullstellen der Grösse nach eintragen.", " Pro Faktor und Intervall eine Testzahl einsetzen: Vorzeichen + oder −.", " Vorzeichen des Produkts pro Intervall bestimmen (Zeile „Produkt“).", " Intervalle mit gewünschtem Vorzeichen aufschreiben, aufsteigend, mit „oder“ verbunden."], "beispiele": [{"t": " (x − 1)(x + 2)(x − 4) < 0", "l": ["Nullstellen: −2, 1, 4", "Vorzeichen   x < −2:  − · − · − = −", "−2 < x < 1:  (x−1) −, (x+2) +, (x−4) − → +", "1 < x < 4:  + · + · − = −", "x > 4:  + · + · + = +", "Gesucht: negativ"], "a": "x < −2 oder 1 < x < 4"}, {"t": " x(16 − x²) < 0", "l": ["16 − x² = (4 − x)(4 + x) → Faktoren x, (4 − x), (4 + x)", "Nullstellen: −4, 0, 4", "x < −4: − · + · − = +", "−4 < x < 0: − · + · + = −", "0 < x < 4: + · + · + = +", "x > 4: + · − · + = −", "Gesucht: negativ"], "a": "−4 < x < 0 oder x > 4"}, {"t": " (2 − x)(x + 5) > 0", "l": ["Nullstellen: −5 und 2", "x < −5: (2−x) +, (x+5) − → −", "−5 < x < 2: + · + = +", "x > 2: − · + = −", "Gesucht: positiv"], "a": "−5 < x < 2"}], "uebungen": [" (x + 3)(x − 2) > 0", " x(25 − x²) > 0", " (x − 1)(x + 4)(x − 6) < 0", " x(x − 7) < 0", " x(4 − x²) < 0"], "loesungen": [" x < −3 oder x > 2     (Nullstellen −3, 2)", " x < −5 oder 0 < x < 5     (Nullstellen −5, 0, 5)", " x < −4 oder 1 < x < 6     (Nullstellen −4, 1, 6)", " 0 < x < 7     (Nullstellen 0, 7)", " −2 < x < 0 oder x > 2     (Nullstellen −2, 0, 2)"]}, {"n": 18, "titel": "Vorzeichendiagramm bei Bruchungleichungen", "typ": "(x + 2(1 − x))/(x(5 − x)) < 0", "formel": ["A/B < 0  ⇔  A und B haben verschiedene Vorzeichen", "A/B > 0  ⇔  A und B haben gleiche Vorzeichen", "Nullstellen des Nenners gehören nie zur Lösung (Division durch 0)"], "schritte": [" Zähler zuerst vereinfachen (Klammern auflösen).", " Nullstellen von Zähler UND Nenner bestimmen.", " Alle auf der Zahlengerade eintragen, Intervalle bilden.", " Vorzeichen von Zähler und Nenner pro Intervall prüfen, dann Vorzeichen des Bruchs.", " Gewünschte Intervalle aufschreiben, aufsteigend, mit „oder“.", " Nie mit dem Nenner multiplizieren: sein Vorzeichen ist unbekannt!"], "beispiele": [{"t": " (x − 2)/(x + 3) < 0", "l": ["Nullstellen: Zähler 2, Nenner −3", "x < −3: − / − = +", "−3 < x < 2: − / + = −", "x > 2: + / + = +", "Gesucht: negat   /* ---------- Sitzung ---------- */
  function start(mode, topic, extra) {
    tab = mode === 'exam' ? 'pruefung' : 'ueben';
    S = { mode, topic, idx: 0, ok: 0, n: 0, results: [], queue: null, t0: Date.now(), group: mode === 'grp' ? topic : null, exam: extra || null };
    if (mode === 'exam') S.queue = EXAMS[extra].q().map((x) => ({ t: x[0], sub: x[1], seed: rnd() }));
    if (mode === 'blitz') { const all = TOPICS.map((t) => t.id); S.queue = []; for (let i = 0; i < 10; i++) S.queue.push({ t: all[Math.floor(Math.random() * all.length)], sub: null, seed: rnd() }); }
    if (mode === 'review') S.queue = data.wrong.map((w) => Object.assign({}, w));
    if (mode === 'weak') S.weak = weakest(3);
    next(true);
  }
  function weakest(k) {
    const c = TOPICS.map((t) => ({ id: t.id, l: level(t.id), n: (data.topics[t.id] || { n: 0 }).n })).filter((x) => x.n > 0);
    c.sort((a, b) => (a.l.acc == null ? 0.5 : a.l.acc) - (b.l.acc == null ? 0.5 : b.l.acc));
    return c.slice(0, k).map((x) => x.id);
  }
  function pickTopic() {
    const pool = S.weak ? TOPICS.filter((t) => S.weak.indexOf(t.id) >= 0) : (S.group ? TOPICS.filter((t) => t.group === S.group) : TOPICS);
    const w = pool.map((t) => { const s = data.topics[t.id]; const n = s ? s.n : 0; const acc = n ? s.ok / n : 0.5; return 1 + 3 * (1 - acc) + (n < 3 ? 1.5 : 0); });
    let r = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return pool[i].id; }
    return pool[0].id;
  }
  function next(first) {
    if (!first && S.queue) S.idx++;
    let spec;
    if (S.queue) { if (S.idx >= S.queue.length) return summary(); spec = S.queue[S.idx]; }
    else spec = { t: S.mode === 'topic' ? S.topic : pickTopic(), seed: rnd(), sub: null };
    S.spec = spec; S.p = makeProblem(spec.t, spec.seed, spec.sub == null ? undefined : spec.sub);
    S.phase = 'ask'; S.counted = false; S.msg = ''; S.hint = false; S.pick = -1; S.each = null;
    render(); window.scrollTo(0, 0);
    const a = document.getElementById('ans0'); if (a && !('ontouchstart' in window)) a.focus();
  }
  function record(ok) {

    data.days = data.days || {}; data.days[today()] = (data.days[today()] || 0) + 1;
    if (ok) { tp.ok++; data.ok++; data.streak++; S.ok++; data.best = Math.max(data.best, data.streak); } else data.streak = 0;
    S.results.push({ t: id, ok });
    const same = (w) => w.t === S.spec.t && w.seed === S.spec.seed;
    if (!ok) { if (!data.wrong.some(same)) data.wrong.unshift({ t: S.spec.t, seed: S.spec.seed, sub: S.spec.sub == null ? null : S.spec.sub }); data.wrong = data.wrong.slice(0, 60); }
    else if (S.mode === 'review') data.wrong = data.wrong.filter((w) => !same(w));
    award(ok);
    save();
  }

  /* ---------- Ansicht: Aufgabe ---------- */

  function keysHTML(p) {

    else if (p.kind === 'lset') keys = [',', '/', '.', '−', '(', ')', '^', '√'];
    else if (p.kind === 'lexpr') keys = base.concat(vs);

    return '<div class="keys" aria-label="Symbolleiste">' + keys.map((k) => '<button type="button" class="key" data-act="ins" data-k="' + k + '">' + k + '</button>').join('') + '<button type="button" class="key" data-act="del" aria-label="Löschen">⌫</button>' + ex + '</div>';

  function render() {
    const p = S.p; const isChoice = p.kind === 'tf' || p.kind === 'mc';
    const t = T(p.topic); const exam = S.mode === 'exam';
    const title = exam ? 'Aufgabe ' + (S.idx + 1) + ' von ' + S.queue.length : (S.mode === 'review' ? 'Fehler wiederholen' : (S.mode === 'mix' ? 'Gemischt' : (S.mode === 'blitz' ? '⏱️ Blitzrunde: ' + (S.idx + 1) + ' von 10' : S.mode === 'weak' ? 'Schwächste Themen' : S.mode === 'grp' ? 'Mischen: ' + S.group : t.name)));

    if (S.queue) h += '<div class="prog" aria-hidden="true"><i style="width:' + Math.round((S.idx / S.queue.length) * 100) + '%"></i></div>';
    h += '<div class="card">' + (S.mode !== 'topic' ? '<div class="small muted" style="margin-bottom:6px">' + esc(t.short) + '</div>' : '') + p.html;
    if (isChoice) h += optionsHTML(p); else h += fieldsHTML(p, S.phase === 'done') + (S.phase === 'done' ? '' : keysHTML(p) + '<p class="help">' + esc(HELP[p.kind] || '') + '</p>');
    if (S.hint && S.phase !== 'done') h += '<div class="hint"><b>Tipp:</b> ' + p.hint + '</div>';
    h += '</div>';
    if (S.phase === 'ask' && S.msg) h += '<div class="res bad" role="alert">Noch nicht richtig<small>' + esc(S.msg) + '</small></div>';
    if (S.phase === 'done') {
      const good = S.lastOk;
      h += '<div class="res ' + (good ? 'ok' : 'bad') + '" role="status">' + (good ? (S.counted && S.firstOk === false ? 'Jetzt stimmt es' : (data.streak >= 3 && S.firstOk ? '🔥 ' + data.streak + ' in Folge' : PRAISE[S.idx % PRAISE.length] + (S.firstOk ? ' +' + (10 + Math.min(Math.max(data.streak - 1, 0), 10)) + ' XP' : ''))) : 'Nicht ganz, das nächste klappt') + (S.msg && !good ? '<small>' + esc(S.msg) + '</small>' : '') + '</div>';
      h += '<div class="card"><h2>' + (good ? 'So geht der Lösungsweg' : 'Lösung und Lösungsweg') + '</h2><p class="ans">Richtig ist: <span class="math">' + p.ansHtml + '</span></p><ol class="steps">' + p.steps.map((s) => '<li>' + s + '</li>').join('') + '</ol></div>';
      h += '<button class="btn primary" data-act="next" id="nextbtn">' + (exam && S.idx === S.queue.length - 1 ? 'Auswertung' : (S.queue && S.idx === S.queue.length - 1 ? 'Fertig' : 'Nächste Aufgabe')) + '</button>';
    } else {
      h += '<div class="grid2">' + (S.hint ? '<button class="btn" data-act="solve">Lösung zeigen</button>' : (exam ? '<button class="btn" data-act="solve">Überspringen</button>' : '<button class="btn" data-act="hint">Tipp</button>')) + (isChoice ? '<button class="btn" data-act="solve">Lösung zeigen</button>' : '<button class="btn primary" data-act="check">Prüfen</button>') + '</div>';
    }
    const thi = thOf(p.topic);
    if (thi != null && !(exam && S.phase !== 'done')) h += '<button class="btn ghost thbtn" data-act="theo" data-i="' + thi + '">📖 Theorie dazu: ' + esc(chTitle(thi)) + '</button>';
    $app.innerHTML = h;
  }
  function readVals() {
    const n = S.p.kind === 'multi' ? S.p.fields.length : 1; const v = [];
    for (let i = 0; i < n; i++) { const el = document.getElementById('ans' + i); v.push(el ? el.value : ''); }
    return v;
  }
  function check() {
    const p = S.p; S.vals = readVals();
    if (S.vals.every((x) => !x.trim())) { S.msg = 'Gib zuerst eine Antwort ein.'; render(); return; }
    const res = checkAnswer(p, p.kind === 'multi' ? S.vals : S.vals[0]);
    if (res.ok) { S.firstOk = !S.counted; record(true); S.lastOk = true; S.phase = 'done'; S.msg = ''; render(); scrollRes(); }
    else { if (!S.counted) { S.firstOk = false; record(false); } S.msg = res.msg || 'Das stimmt noch nicht.'; render(); scrollRes(); const a = document.getElementById('ans0'); if (a) a.focus(); }
  }
  function scrollRes() { const el = document.querySelector('.res'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  function solve() { if (S.p.kind !== 'tf' && S.p.kind !== 'mc') S.vals = readVals(); if (!S.counted) { S.firstOk = false; record(false); } S.lastOk = false; S.phase = 'done'; S.msg = ''; render(); scrollRes(); }
  function pickOpt(i) {
    if (S.phase === 'done') return; S.pick = i; const ok = i === S.p.correct; record(ok); S.firstOk = ok; S.lastOk = ok; S.phase = 'done'; render(); scrollRes();
  }

  /* ---------- Auswertung ---------- */
  function summary() {
    const n = S.results.length, ok = S.results.filter((r) => r.ok).length; const pc = n ? Math.round((ok / n) * 100) : 0;
    const by = {}; S.results.forEach((r) => { (by[r.t] = by[r.t] || []).push(r.ok); });
    const rows = Object.keys(by).map((id) => '<div class="sumrow"><span>' + esc(T(id).name) + '</span><b>' + by[id].filter(Boolean).length + ' / ' + by[id].length + '</b></div>').join('');
    const mins = Math.max(1, Math.round((Date.now() - S.t0) / 60000)); if (S.mode === 'exam') { data.exams = data.exams || []; data.exams.unshift({ name: EXAMS[S.exam].name.split(':')[0], ok, n, min: mins, date: new Date().toLocaleDateString('de-CH') }); data.exams = data.exams.slice(0, 12); save(); }
    if (S.mode === 'blitz') { data.blitz = Math.max(ok, 0); award(false); save(); }
    if (pc >= 80 && (S.mode === 'exam' || S.mode === 'blitz')) setTimeout(() => confetti(50), 200);
    const msg = pc >= 85 ? 'Sehr stark.' : pc >= 60 ? 'Solide. Die roten Themen nochmals üben.' : 'Noch Luft nach oben. Übe die Themen unten einzeln.';
    $app.innerHTML = '<div class="bar"><button class="btn ghost back" data-act="home" aria-label="Zurück">←</button><div class="ttl">Auswertung</div></div><div class="card"><div class="big">' + ok + ' / ' + n + '</div><p class="muted" style="margin:4px 0 12px">' + pc + ' % richtig, ' + mins + ' min. ' + msg + '</p>' + rows + '</div><div class="stack"><button class="btn primary" data-act="' + (S.mode === 'review' ? 'review' : S.mode === 'blitz' ? 'blitz' : 'exam') + '" data-e="' + (S.exam || 'A') + '">Nochmal</button><button class="btn" data-act="home">Zur Übersicht</button></div>' + nav();
    window.scrollTo(0, 0);
  }

  /* ---------- Ereignisse ---------- */
  document.addEventListener('focusin', (e) => { if (e.target && e.target.matches && e.target.matches('input[type=text]')) lastInput = e.target; });
  $app.addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('.key')) e.preventDefault(); });
  $app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const a = b.dataset.act;
    if (a === 'topic') start('topic', b.dataset.id);
    else if (a === 'mix') start('mix');
    else if (a === 'exam') start('exam', null, b.dataset.e || 'A');
    else if (a === 'blitz') start('blitz');
    else if (a === 'weak') start('weak');
    else if (a === 'goal') { data.goal = Math.max(5, Math.min(200, (data.goal || 20) + Number(b.dataset.d))); save(); progress(); }
    else if (a === 'export') { try { const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'mathe-fortschritt-' + today() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); } catch (err) { alert('Sichern ging nicht.'); } }
    else if (a === 'import') { const f = document.getElementById('impf'); if (f) f.click(); }
    else if (a === 'grp') start('grp', b.dataset.g);
    else if (a === 'tab') { tab = b.dataset.tab; S = null; home(); }
    else if (a === 'chap') { const i = Number(b.dataset.i); if (i >= 0 && i < 24) chapter(i); }
    else if (a === 'theoryback') { tab = 'theorie'; home(); }
    else if (a === 'theo') { S.vals = readVals ? (S.p.kind === 'tf' || S.p.kind === 'mc' ? S.vals : readVals()) : S.vals; chapter(Number(b.dataset.i), 'resume'); }
    else if (a === 'resume') { render(); }
    else if (a === 'fsec') { fsec = Number(b.dataset.s); tab = 'formeln'; formulas(); }
    else if (a === 'xtra') { const el = document.getElementById('ans0'); if (el) { el.value = b.dataset.v; S.vals = [b.dataset.v]; check(); } }
    else if (a === 'review') { if (data.wrong.length) start('review'); }
    else if (a === 'home') home();
    else if (a === 'next') next();
    else if (a === 'check') check();
    else if (a === 'solve') solve();
    else if (a === 'hint') { S.hint = true; S.vals = readVals(); render(); }
    else if (a === 'pick') pickOpt(Number(b.dataset.i));
    else if (a === 'ins' || a === 'del') {
      const el = (lastInput && document.body.contains(lastInput)) ? lastInput : document.getElementById('ans0'); if (!el) return;
      el.focus(); const s = el.selectionStart == null ? el.value.length : el.selectionStart, en = el.selectionEnd == null ? s : el.selectionEnd;
      if (a === 'ins') { const k = b.dataset.k; el.value = el.value.slice(0, s) + k + el.value.slice(en); el.setSelectionRange(s + k.length, s + k.length); }
      else if (s !== en) { el.value = el.value.slice(0, s) + el.value.slice(en); el.setSelectionRange(s, s); }
      else if (s > 0) { el.value = el.value.slice(0, s - 1) + el.value.slice(s); el.setSelectionRange(s - 1, s - 1); }
    }
    else if (a === 'reset') { if (b.dataset.sure) { data = { total: 0, ok: 0, streak: 0, best: 0, topics: {}, wrong: [], recent: {}, days: {}, read: {}, goal: 20, xp: 0, badges: {} }; save(); home(); } else { b.dataset.sure = '1'; b.textContent = 'Wirklich löschen? Nochmals tippen.'; } }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !S || !S.p) return;
    if (S.phase === 'done') { const nb = document.getElementById('nextbtn'); if (nb) { e.preventDefault(); next(); } }
    else if (e.target && e.target.matches && e.target.matches('input[type=text]')) {
      e.preventDefault(); const i = Number(e.target.dataset.i || 0); const nx = document.getElementById('ans' + (i + 1));
      if (nx) nx.focus(); else check();
    }
  });
  $app.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'impf' && e.target.files && e.target.files[0]) {
      const fr = new FileReader();
      fr.onload = () => { try { const d = JSON.parse(fr.result); if (typeof d.total !== 'number' || typeof d.topics !== 'object') throw new Error('x'); data = Object.assign({ total: 0, ok: 0, streak: 0, best: 0, topics: {}, wrong: [], recent: {}, days: {}, read: {}, goal: 20, xp: 0, badges: {} }, d); save(); progress(); } catch (err) { alert('Diese Datei ist keine gültige Sicherung.'); } };
      fr.readAsText(e.target.files[0]);
    }
  });
  $app.addEventListener('input', (e) => { if (e.target && e.target.id === 'tq') { tfilter = e.target.value; theoryList(); } });
  home();
  window.__mt = { start, home, get S() { return S; } };
})();

})();
</script>
